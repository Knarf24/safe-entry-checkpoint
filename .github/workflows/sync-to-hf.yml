name: Deploy to Hugging Face Spaces

# Every push to main copies this repo to a free Hugging Face Space, where the app runs.
# Needs one repository secret: HF_TOKEN (a Hugging Face token with "Write" access).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.25"
      - name: Create the Space (first run) and upload the app
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_NAME: safe-entry-checkpoint
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              sys.exit("HF_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions.")
          api = HfApi(token=token)
          user = api.whoami()["name"]
          repo_id = f"{user}/{os.environ['SPACE_NAME']}"
          api.create_repo(repo_id, repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=".",
              ignore_patterns=[".git/*", ".github/*", "docs/*", "*.pyc"],
              commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]} from GitHub",
          )
          url = f"https://huggingface.co/spaces/{repo_id}"
          print(f"Live at: {url}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Deployed\n\nLive demo: {url}\n")
          PY
